<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diablo II Mod - Runeword Compendium</title>
<style>
    :root {
        --bg-dark: #070709;
        --bg-card: #0e0e12;
        --bg-card-hover: #14141b;
        --gold: #c7b377;
        --gold-bright: #f0d88b;
        --rune-orange: #ff9900;
        --magic-blue: #6969ff;
        --text-gray: #9a9a9a;
        --text-light: #d8d8d8;
        --border-dark: #2a241b;
        --border-gold: #665633;
        --red: #ff4d4d;
        --green: #00e600;
    }

    * { box-sizing: border-box; }

    body {
        background-color: var(--bg-dark);
        background-image: radial-gradient(circle at 50% 0%, #1c1610 0%, #070709 70%);
        color: var(--text-light);
        font-family: 'Exocet', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
    }

    header {
        max-width: 1300px;
        margin: 0 auto 25px auto;
        text-align: center;
        border-bottom: 2px solid var(--border-gold);
        padding-bottom: 18px;
    }

    h1 {
        color: var(--gold);
        text-transform: uppercase;
        letter-spacing: 3px;
        margin: 0 0 8px 0;
        text-shadow: 0 2px 8px rgba(0,0,0,0.9), 0 0 15px rgba(199, 179, 119, 0.25);
        font-size: 2.2rem;
    }

    .subtitle {
        color: var(--text-gray);
        font-size: 0.95rem;
        margin-bottom: 15px;
    }

    .controls {
        max-width: 1300px;
        margin: 0 auto 25px auto;
        background: #101015;
        border: 1px solid var(--border-gold);
        padding: 15px;
        border-radius: 4px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    }

    .filter-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        flex: 1;
    }

    input[type="text"], select {
        background: #060608;
        color: var(--gold-bright);
        border: 1px solid #443a24;
        padding: 9px 13px;
        font-family: inherit;
        font-size: 0.95rem;
        border-radius: 3px;
        outline: none;
    }

    input[type="text"] {
        flex: 1;
        min-width: 240px;
    }

    input[type="text"]:focus, select:focus {
        border-color: var(--gold);
        box-shadow: 0 0 6px rgba(199, 179, 119, 0.35);
    }

    .btn {
        background: linear-gradient(180deg, #3a2e18 0%, #1f180b 100%);
        color: var(--gold-bright);
        border: 1px solid var(--gold);
        padding: 9px 16px;
        font-family: inherit;
        font-weight: bold;
        cursor: pointer;
        border-radius: 3px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 0.85rem;
        transition: all 0.2s;
    }

    .btn:hover {
        background: linear-gradient(180deg, #524122 0%, #2e2410 100%);
        box-shadow: 0 0 10px rgba(199, 179, 119, 0.4);
    }

    .stats-bar {
        max-width: 1300px;
        margin: 0 auto 15px auto;
        color: var(--text-gray);
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
    }

    .grid {
        max-width: 1300px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 18px;
    }

    .rw-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-dark);
        border-top: 2px solid var(--border-gold);
        padding: 18px;
        border-radius: 4px;
        text-align: center;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.85), 0 4px 10px rgba(0,0,0,0.6);
        transition: transform 0.15s ease, border-color 0.15s ease;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        position: relative;
    }

    .rw-card:hover {
        background-color: var(--bg-card-hover);
        border-color: var(--gold);
        transform: translateY(-2px);
    }

    .rw-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 2px;
        font-family: sans-serif;
        text-transform: uppercase;
    }

    .badge-active {
        background: rgba(0, 230, 0, 0.12);
        color: var(--green);
        border: 1px solid rgba(0, 230, 0, 0.35);
    }

    .badge-inactive {
        background: rgba(255, 77, 77, 0.12);
        color: var(--red);
        border: 1px solid rgba(255, 77, 77, 0.35);
    }

    .rw-title {
        color: var(--gold);
        font-size: 1.4rem;
        font-weight: bold;
        margin: 4px 0 6px 0;
        letter-spacing: 0.5px;
    }

    .rw-recipe {
        color: var(--rune-orange);
        font-weight: bold;
        font-size: 1.05rem;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
    }

    .rw-base {
        color: var(--text-gray);
        font-size: 0.9rem;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px dashed #262630;
    }

    .rw-base span {
        color: var(--text-light);
    }

    .rw-props {
        list-style: none;
        padding: 0;
        margin: 0;
        color: var(--magic-blue);
        font-size: 0.98rem;
        line-height: 1.5;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 500;
    }

    .rw-props li {
        margin-bottom: 3px;
        text-shadow: 0 1px 2px #000;
    }

    @media (max-width: 600px) {
        .grid { grid-template-columns: 1fr; }
        h1 { font-size: 1.6rem; }
    }
</style>
</head>

const grid = document.getElementById('rwGrid');
const searchInput = document.getElementById('searchInput');
const typeFilter = document.getElementById('typeFilter');
const socketFilter = document.getElementById('socketFilter');
const statusFilter = document.getElementById('statusFilter');
const countDisplay = document.getElementById('countDisplay');

function renderRunewords() {
    const query = searchInput.value.toLowerCase().trim();
    const typeVal = typeFilter.value;
    const sockVal = socketFilter.value;
    const statusVal = statusFilter.value;

    const filtered = RUNEWORDS.filter(rw => {
        if (statusVal !== 'ALL') {
            const isAct = statusVal === '1';
            if (rw.active !== isAct) return false;
        }
        if (sockVal !== 'ALL' && rw.sockets !== parseInt(sockVal)) {
            return false;
        }
        if (typeVal !== 'ALL') {
            const b = rw.bases.toLowerCase();
            if (typeVal === 'Weapon') {
                const weaponKeywords = ['weapon', 'sword', 'axe', 'mace', 'scepter', 'staff', 'wand', 'dagger', 'claw', 'orb', 'javelin', 'throwing'];
                if (!weaponKeywords.some(k => b.includes(k))) return false;
            } else if (typeVal === 'Helm') {
                if (!b.includes('helm') && !b.includes('pelt')) return false;
            } else if (typeVal === 'Shield') {
                if (!b.includes('shield')) return false;
            } else {
                if (!b.includes(typeVal.toLowerCase())) return false;
            }
        }
        if (query) {
            const hayStack = (rw.name + ' ' + rw.runes + ' ' + rw.bases + ' ' + rw.stats.join(' ')).toLowerCase();
            const terms = query.split(/\s+/);
            if (!terms.every(t => hayStack.includes(t))) return false;
        }
        return true;
    });

    countDisplay.textContent = `Showing ${filtered.length} of ${RUNEWORDS.length} Runewords`;

    grid.innerHTML = filtered.map(rw => `
        <div class="rw-card">
            <span class="rw-badge ${rw.active ? 'badge-active' : 'badge-inactive'}">
                ${rw.active ? 'Active' : 'Disabled'}
            </span>
            <div class="rw-title">${rw.name}</div>
            <div class="rw-recipe">'${rw.runes.replace(/ \+ /g, '')}' (${rw.runes})</div>
            <div class="rw-base">${rw.sockets} Socket <span>${rw.bases}</span></div>
            <ul class="rw-props">
                ${rw.stats.map(s => `<li>${s}</li>`).join('')}
            </ul>
        </div>
    `).join('');
}

function downloadSelf() {
    const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    const blob = new Blob([htmlContent], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "D2_Mod_Runewords.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

searchInput.addEventListener('input', renderRunewords);
typeFilter.addEventListener('change', renderRunewords);
socketFilter.addEventListener('change', renderRunewords);
statusFilter.addEventListener('change', renderRunewords);

renderRunewords();
</script>
